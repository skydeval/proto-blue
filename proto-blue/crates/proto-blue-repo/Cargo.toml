[package]
name = "proto-blue-repo"
description = "AT Protocol repository: MST, CAR files, commits, block storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["atproto", "bluesky", "merkle-tree", "car", "repository"]
categories = ["data-structures", "encoding"]

[dependencies]
async-trait = { workspace = true, optional = true }
proto-blue-common = { workspace = true }
proto-blue-crypto = { workspace = true }
proto-blue-lexicon = { workspace = true }
proto-blue-lex-data = { workspace = true }
proto-blue-lex-cbor = { workspace = true }
proto-blue-syntax = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
unsigned-varint = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Target-conditional: on native, the firehose client uses the tungstenite
# backend; on wasm32 it uses gloo-ws. Both are optional and activated by
# the `firehose-client` feature below.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
proto-blue-ws = { workspace = true, optional = true, features = ["tungstenite"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
proto-blue-ws = { workspace = true, optional = true, features = ["gloo-ws"] }

[features]
default = ["firehose-client"]
# Pulls in the live firehose WebSocket client (`Firehose`). Uses
# tungstenite on native, gloo-net on wasm32 — see the target-conditional
# dependency tables above.
firehose-client = ["dep:proto-blue-ws"]
# Adds `sign_commit_async` (parallel to `sign_commit`) taking an
# `AsyncSigner` and awaiting the signature. Byte-identical output to
# `sign_commit` for any given (unsigned, signing key) pair. Enable for
# async signing transports; leave off for purely local keys.
async-signer = ["dep:async-trait", "proto-blue-crypto/async-signer"]

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
